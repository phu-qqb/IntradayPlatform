name: Demo strategy bridge qualification
on:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tools/QQ.Production.Intraday.Lmax.ConnectivityLab/**'
      - 'tests/QQ.Production.Intraday.Tests.Unit/**'
      - '.github/workflows/demo-strategy-bridge-qualification.yml'

jobs:
  qualify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore .\QQ.Production.Intraday.sln
      - name: Build worker
        run: dotnet build .\src\QQ.Production.Intraday.Worker\QQ.Production.Intraday.Worker.csproj -c Release --no-restore
      - name: Bridge tests
        run: dotnet test .\tests\QQ.Production.Intraday.Tests.Unit\QQ.Production.Intraday.Tests.Unit.csproj -c Release --no-restore --filter "FullyQualifiedName~LmaxDemoStrategyBridgeTests"
      - name: LMAX regressions
        run: dotnet test .\tests\QQ.Production.Intraday.Tests.Unit\QQ.Production.Intraday.Tests.Unit.csproj -c Release --no-restore --filter "FullyQualifiedName~LmaxConnectivityLabTests|FullyQualifiedName~Arch7bLmaxFixKnownOrderContractTests"
      - name: Diff check
        shell: bash
        run: git diff --check origin/master...HEAD
