name: Qualify EF migration repair

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore QQ.Production.Intraday.sln
          dotnet add src/QQ.Production.Intraday.Worker/QQ.Production.Intraday.Worker.csproj package Microsoft.EntityFrameworkCore.Design --version 10.0.0
      - name: Verify migration registration
        run: |
          dotnet ef migrations list --no-connect \
            --project src/QQ.Production.Intraday.Infrastructure.SqlServer/QQ.Production.Intraday.Infrastructure.SqlServer.csproj \
            --startup-project src/QQ.Production.Intraday.Worker/QQ.Production.Intraday.Worker.csproj \
            --context IntradayDbContext
      - name: Verify no pending model changes
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/QQ.Production.Intraday.Infrastructure.SqlServer/QQ.Production.Intraday.Infrastructure.SqlServer.csproj \
            --startup-project src/QQ.Production.Intraday.Worker/QQ.Production.Intraday.Worker.csproj \
            --context IntradayDbContext
      - name: Build Worker
        run: dotnet build src/QQ.Production.Intraday.Worker/QQ.Production.Intraday.Worker.csproj --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/QQ.Production.Intraday.Tests.Unit/QQ.Production.Intraday.Tests.Unit.csproj --configuration Release --no-restore
