name: Diagnose EF pending model

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore solution
        run: dotnet restore QQ.Production.Intraday.sln
      - name: Generate pending-model migration
        run: |
          dotnet ef migrations add DemoDay1DurableStore \
            --project src/QQ.Production.Intraday.Infrastructure.SqlServer/QQ.Production.Intraday.Infrastructure.SqlServer.csproj \
            --startup-project src/QQ.Production.Intraday.Worker/QQ.Production.Intraday.Worker.csproj \
            --context IntradayDbContext \
            --output-dir Migrations
      - name: Capture generated migration
        shell: bash
        run: |
          mkdir -p artifacts/generated
          git status --short > artifacts/status.txt
          git diff -- src/QQ.Production.Intraday.Infrastructure.SqlServer/Migrations > artifacts/pending-model.patch
          cp src/QQ.Production.Intraday.Infrastructure.SqlServer/Migrations/*DemoDay1DurableStore* artifacts/generated/
          cp src/QQ.Production.Intraday.Infrastructure.SqlServer/Migrations/IntradayDbContextModelSnapshot.cs artifacts/generated/
      - uses: actions/upload-artifact@v4
        with:
          name: ef-pending-model
          path: artifacts
          retention-days: 1
