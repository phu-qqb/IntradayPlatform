name: PR92 .NET 10 qualification

on:
  push:
    branches:
      - codex/lmax-canonical-snapshot-handoff
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lmax-canonical-snapshot-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/QQ.Production.Intraday.Tests.Unit/QQ.Production.Intraday.Tests.Unit.csproj --configuration Release --filter FullyQualifiedName~LmaxCanonicalSnapshotIngestionTests --logger "console;verbosity=minimal"
