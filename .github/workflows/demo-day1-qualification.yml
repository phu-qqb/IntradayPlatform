name: Demo Day 1 handoff qualification

on:
  push:
    branches:
      - codex/demo-day1-legacy-anubis-handoff
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/QQ.Production.Intraday.Tests.Unit/QQ.Production.Intraday.Tests.Unit.csproj
      - name: Build Worker
        run: dotnet build src/QQ.Production.Intraday.Worker/QQ.Production.Intraday.Worker.csproj -c Release --no-restore
      - name: Focused tests
        run: >-
          dotnet test tests/QQ.Production.Intraday.Tests.Unit/QQ.Production.Intraday.Tests.Unit.csproj
          -c Release --no-restore
          --filter "FullyQualifiedName~LegacyAnubisWeightIngestionTests|FullyQualifiedName~LmaxDemoStrategyBridgeTests"
